<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPTI人格测试（H5）</title>
    <link rel="stylesheet" href="./h5/css/style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div class="badge">全新情侣向解析</div>
        <h1 class="title">MBTI和SBTI都测了，确定不测测cpti吗</h1>
        <div class="divider"></div>
        <p class="desc">
          别人谈恋爱靠缘分，你谈恋爱靠复盘群聊截图。<br />
          15道离谱但诚实的情侣拷问，专治“我没事”和“随便都行”。<br />
          测完建议发给那位特别关注对象：要么双向奔赴，要么双向抽象。
        </p>
        <div class="actions">
          <button class="btn-primary" id="startBtn">开测我的情侣类型</button>
        </div>
        <div class="credits">CPTI 抽象恋爱实验室出品</div>
      </div>
    </div>

    <script src="./h5/js/index.js"></script>
  </body>
</html>
